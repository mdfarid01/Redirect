<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe Access Awareness — Verification</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container"><header class="site-header"><div class="brand-name">Safe<span>Access</span></div></header>
      <section class="card step-card">
        <div class="progress"><span class="active"></span><span class="active"></span></div>
        <div class="card-header"><h2>Secure your access</h2><p class="notice">Enter your phone number to complete this authorised awareness activity.</p></div>
        <form id="stepTwoForm" novalidate>
          <input id="name" name="name" type="hidden" />
          <input id="email" name="email" type="hidden" />

          <label for="phone">Phone Number</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+14155552671"
            required
          />

          <p class="error" id="errorText"></p>
          <button type="submit">CONTINUE</button>
          <p class="privacy-note">Do not enter passwords, one-time codes, or payment details.</p>
        </form>
      </section>
    </main>
    <script src="/tracking.js" defer></script>
    <script src="/phone.js" defer></script>
  </body>
</html>
